<!doctype html>
<html>
<body>

<h1>NZ Legislation Search Demo</h1>

<form id="search-form">
  <input id="search-term" value="space">
  <button type="submit">Search</button>
</form>

<p id="status">Ready.</p>

<script>
const API_BASE =
  "https://withered-king-3fd4.andy-hkn.workers.dev/";

document
  .getElementById("search-form")
  .addEventListener("submit", async (event) => {

    event.preventDefault();

    const term =
      document.getElementById("search-term").value;

    const status =
      document.getElementById("status");

    status.textContent = "Searching...";

    try {

      const url = new URL(API_BASE);

      url.searchParams.set("search_term", term);
      url.searchParams.set("search_field", "content");
      url.searchParams.set("per_page", "20");

      const response = await fetch(url);

      const data = await response.json();

      status.textContent =
        `Found ${data.total} results`;

    } catch (error) {

      status.textContent =
        `Failed: ${error.message}`;

      console.error(error);
    }
});
</script>

</body>
</html>
