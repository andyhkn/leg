<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NZ Legislation Search Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h1>NZ Legislation Search Demo</h1>

  <form id="search-form">
    <input id="search-term" value="space" />
    <button type="submit">Search</button>
  </form>

  <p id="status">Enter a search term.</p>

  <script>
    const API_BASE = "https://withered-king-3fd4.andy-hkn.workers.dev/";

    document.getElementById("search-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const term = document.getElementById("search-term").value.trim();
      const status = document.getElementById("status");

      if (!term) {
        status.textContent = "Please enter a search term.";
        return;
      }

      const url = new URL(API_BASE);
      url.searchParams.set("search_term", term);
      url.searchParams.set("search_field", "content");
      url.searchParams.set("per_page", "20");

      status.textContent = "Searching...";

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`API returned ${response.status}`);
        }

        const data = await response.json();
        status.textContent = `Found ${data.total} results for "${term}".`;
      } catch (error) {
        status.textContent = `Search failed: ${error.message}`;
      }
    });
  </script>
</body>
</html>
